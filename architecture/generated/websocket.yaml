# ═══ GÉNÉRÉ — NE PAS ÉDITER ═══════════════════════════════════════════
# Produit par `python architecture/build.py` depuis le code source.
# Toute correction se fait dans le code, jamais ici : ce fichier est
# comparé au code par `--check`, il perdrait toujours l'arbitrage.
# Contrat de messages Core ↔ HUD, dans les deux sens et sur les deux canaux.
version: 1
# Deux canaux parallèles : `type` (événements) et `command`
# (impératifs, via cmd() → {"command": …}). Le HUD les teste
# séparément. Ne pas les fusionner.

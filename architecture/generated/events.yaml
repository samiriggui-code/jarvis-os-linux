# ═══ GÉNÉRÉ — NE PAS ÉDITER ═══════════════════════════════════════════
# Produit par `python architecture/build.py` depuis le code source.
# Toute correction se fait dans le code, jamais ici : ce fichier est
# comparé au code par `--check`, il perdrait toujours l'arbitrage.
# Bus interne et signaux de séquence — hors de portée de l'AST.
version: 1
bus_publies:
  - evenement: GESTURE_DETECTED
    politique_debit: PASS
    sources: [core/jarvis_core/gestures.py]
  - evenement: VISION_SCENE
    politique_debit: COALESCE
    sources: [core/jarvis_core/vision_objects.py]
publications_dynamiques:  # type passé en variable, invisible à l'AST
  - "core/jarvis_core/orchestrator_lifecycle.py:L262"
  - "core/jarvis_core/orchestrator_lifecycle.py:L264"
  - "core/jarvis_core/orchestrator_lifecycle.py:L543"
  - "core/jarvis_core/orchestrator_lifecycle.py:L562"
  - "core/jarvis_core/vision_objects.py:L261"
  - "core/jarvis_core/ws/handlers/auth.py:L139"
  - "core/jarvis_core/ws/handlers/system.py:L191"
politiques_sans_emetteur_STATIQUE:  # peuvent être publiées dynamiquement, cf. ci-dessus
  - ACTION_DEMANDED
  - ACTION_EXECUTED
  - ALERT_CLEARED
  - ALERT_RAISED
  - BODY_POSE
  - DEVICE_OFFLINE
  - DEVICE_ONLINE
  - EYE_GAZE
  - FACE_FRAME
  - HAND_FIST
  - HAND_OPEN
  - HAND_PEACE
  - HAND_PINCH
  - HAND_POINT
  - HAND_POSE_POINT
  - HAND_SWIPE
  - MEMORY_FORGOTTEN
  - MEMORY_RECALLED
  - MEMORY_REJECTED
  - MEMORY_STORED
  - MEMORY_STORE_REJECTED
  - PROPOSITION
  - RESULT_DISPUTED
  - RESULT_FAILED
  - RESULT_OBSERVED
  - RESULT_VALIDATED
  - SYSTEM_METRICS
  - VISION_OBJECT_DETECTED
  - VISION_OBJECT_LOST
  - VISION_OBJECT_UPDATED
signaux_sequence:
  - signal: enroll.name
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/intents/executors_hud.py]
  - signal: enroll.profile
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/intents/executors_hud.py]
  - signal: enroll.voice
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/voice.py]
  - signal: face.landmarks
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/holomat.py]
  - signal: face.matched
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/holomat.py]
  - signal: face.model
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/holomat.py]
  - signal: face.presence
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/holomat.py]
  - signal: face.scanning
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/holomat.py]
  - signal: voice.captured
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/voice.py]
  - signal: voice.matched
    attendu_par_une_sequence: false
    sources: [core/jarvis_core/ws/handlers/voice.py]
attendus_jamais_emis:

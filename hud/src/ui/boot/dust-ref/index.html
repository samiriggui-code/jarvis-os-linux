<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Dust</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CopyShader } from 'three/addons/shaders/CopyShader.js'

const Lerp = (a, b, t) => a + (b - a) * t
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 }

const bgColor = '#1a0a04'
const flameColor = '#ff7a2a'
const flameColor2 = '#ffce5a'
const flameAmt = 0.2
const colorRust = '#b3401f'
const colorAmber = '#ffc46b'
const opacity = 0.68
const pointSize = 12
const brightness = 1.1
const pointCount = 940
const fadeMs = 2200
const driftSpeed = 0.85
const spreadW = 18
const spreadH = 14
const spreadD = 28

const FinalPass = {
  uniforms: {
    iTime: { value: 0 },
    tDiffuse: { value: null },
    torusTexture: { value: null },
    bloomTexture: { value: null },
    haloTexture: { value: null },
    uBg: { value: hexToVec3(bgColor) },
    uFlameA: { value: hexToVec3(flameColor) },
    uFlameB: { value: hexToVec3(flameColor2) },
    uFlameAmt: { value: flameAmt }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}
`
}

const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.VSMShadowMap

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x000000)
scene.fog = new THREE.Fog(0x000000, 0, 22)

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400)
camera.position.set(0, 0, 16)
camera.layers.enable(LAYERS.TORUS_SCENE)
camera.layers.enable(LAYERS.BLOOM_SCENE)
camera.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(camera)

const positions = new Float32Array(pointCount * 3)
const seeds = new Float32Array(pointCount)
const colMix = new Float32Array(pointCount)
for (let i = 0; i < pointCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * spreadW
  positions[i * 3 + 1] = (Math.random() - 0.5) * spreadH
  positions[i * 3 + 2] = (Math.random() - 0.5) * spreadD - 4
  seeds[i] = Math.random()
  colMix[i] = Math.random()
}

const dustGeo = new THREE.BufferGeometry()
dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
dustGeo.setAttribute('seed', new THREE.Float32BufferAttribute(seeds, 1))
dustGeo.setAttribute('colMix', new THREE.Float32BufferAttribute(colMix, 1))

const uniforms = {
  uTime: { value: 0 },
  uAlpha: { value: 0 },
  uColRust: { value: hexToVec3(colorRust) },
  uColAmber: { value: hexToVec3(colorAmber) },
  uOpacity: { value: opacity },
  uSize: { value: pointSize },
  uBrightness: { value: brightness },
  uDrift: { value: driftSpeed },
  uSpreadD: { value: spreadD }
}

const dustMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms,
  vertexShader: `
uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uSpreadD;
uniform vec3 uColRust; uniform vec3 uColAmber;
attribute float seed; attribute float colMix;
varying vec3 vColor; varying float vFade;
vec3 warp3d(vec3 pos, float t){ float curv=0.55,a=1.6,b=0.35; pos*=1.6;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return pos; }
void main() {
  vec3 base = position;
  vec3 w = warp3d(base * 0.12, uTime * 0.4 + seed * 6.28) * 0.35;
  vec3 p = base + w;
  p.z += uTime * uDrift;
  p.z = fract((p.z + uSpreadD * 0.5) / uSpreadD) * uSpreadD - uSpreadD * 0.5;
  p.x += sin(uTime * 0.25 + seed * 12.0) * 0.08;
  p.y += cos(uTime * 0.22 + seed * 9.0) * 0.06;

  vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
  vColor = mix(uColRust, uColAmber, colMix);
  vFade = 0.55 + 0.45 * sin(uTime * 0.8 + seed * 4.0);

  gl_PointSize = uSize * (10.0 / -mvPosition.z);
  gl_PointSize = max(gl_PointSize, 1.2);
  gl_Position = projectionMatrix * mvPosition;
}
`,
  fragmentShader: `
uniform float uOpacity; uniform float uBrightness; uniform float uAlpha;
varying vec3 vColor; varying float vFade;
void main() {
  vec2 xy = gl_PointCoord - 0.5;
  float ll = length(xy);
  if (ll > 0.5) discard;
  float a = smoothstep(0.5, 0.15, ll);
  gl_FragColor = vec4(vColor * uBrightness, vFade * a * uOpacity * uAlpha);
}
`
})

const dustPoints = new THREE.Points(dustGeo, dustMat)
dustPoints.frustumCulled = false
dustPoints.layers.enable(LAYERS.TORUS_SCENE)
dustPoints.layers.enable(LAYERS.BLOOM_SCENE)
dustPoints.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(dustPoints)

const renderScene = new RenderPass(scene, camera)

const torusComposer = new EffectComposer(renderer)
torusComposer.renderToScreen = false
torusComposer.addPass(renderScene)
torusComposer.addPass(new ShaderPass(GammaCorrectionShader))
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.2, 0))
torusComposer.addPass(new ShaderPass(CopyShader))

const bloomComposer = new EffectComposer(renderer)
bloomComposer.renderToScreen = false
bloomComposer.addPass(renderScene)
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.5, 0))
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader))

const finalPass = new ShaderPass(FinalPass)
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture
const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(renderScene)
finalComposer.addPass(finalPass)

const sceneObj = {
  appearStart: performance.now(),
  render() {
    const t = performance.now() / 1000
    uniforms.uTime.value = t
    const elapsed = performance.now() - this.appearStart
    uniforms.uAlpha.value = Math.min(1, elapsed / fadeMs)
    finalPass.uniforms.iTime.value = t
  }
}

function onResize() {
  const w = innerWidth
  const h = innerHeight
  const dpr = window.devicePixelRatio
  renderer.setPixelRatio(dpr)
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  for (const c of [torusComposer, bloomComposer, finalComposer]) {
    c.setPixelRatio(dpr)
    c.setSize(w, h)
  }
}

window.addEventListener('resize', onResize)
onResize()

function render() {
  requestAnimationFrame(render)
  sceneObj.render()
  camera.layers.set(LAYERS.TORUS_SCENE)
  torusComposer.render()
  camera.layers.set(LAYERS.BLOOM_SCENE)
  bloomComposer.render()
  camera.layers.set(LAYERS.ENTIRE_SCENE)
  finalComposer.render()
}
render()
  </script>
</body>
</html>

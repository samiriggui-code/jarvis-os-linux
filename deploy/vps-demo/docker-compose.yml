# Démo VPS — Core + HUD + ElevenLabs. PAS de HA / Pi / Hermes / Ollama.
# Usage :
#   export ANTHROPIC_API_KEY=...
#   export ELEVENLABS_API_KEY=...   # ou ELEVENLABS_API_KEY selon .env Core
#   docker compose -f deploy/vps-demo/docker-compose.yml up -d --build
#
# HUD : http://VPS_IP/
# WS  : ws://VPS_IP/ws

services:
  core:
    build:
      context: ../..
      dockerfile: deploy/vps-demo/Dockerfile.core
    environment:
      JARVIS_WS_HOST: "0.0.0.0"
      JARVIS_WS_PORT: "8765"
      JARVIS_VOICEBOX_TTS: "0"
      JARVIS_ELEVENLABS_FALLBACK: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      JARVIS_ANTHROPIC_MODEL: "${JARVIS_ANTHROPIC_MODEL:-claude-sonnet-4-5}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      JARVIS_FORCE_SYSTEM: "0"
    volumes:
      - jarvis_core_data:/app/core/data
    restart: unless-stopped
    expose:
      - "8765"

  hud:
    build:
      context: ../..
      dockerfile: deploy/vps-demo/Dockerfile.hud
    ports:
      - "80:80"
    depends_on:
      - core
    restart: unless-stopped

volumes:
  jarvis_core_data:

# HUD JARVIS en HTTPS sur le LAN — `jarvis.global-it-ss.com` → 192.168.1.37
#
# Installation : /etc/nginx/conf.d/jarvis-lan.conf
#
# ─── POURQUOI UN CERTIFICAT PUBLIC POUR UNE IP PRIVÉE ─────────────────────
#
# `getUserMedia` — caméra et micro — exige un contexte sécurisé. Sans HTTPS
# valide, l'enrôlement facial et la voix ne démarrent pas, et le navigateur ne
# dit RIEN : il rejette la promesse, le HUD note « caméra refusée » dans sa
# console, et l'écran reste sur un visage figé. C'est exactement le symptôme
# qu'on a passé une matinée à chercher.
#
# Un certificat auto-signé ne convient pas : il faudrait l'installer sur la
# tablette murale, celles des filles, le téléphone de chacun — c'est-à-dire
# précisément le coût par appareil qu'on refuse (cf. le rejet de Twingate).
#
# La sortie est le challenge DNS-01 : la validation se fait par un
# enregistrement TXT, donc AUCUN port n'a besoin d'être ouvert, et le nom peut
# parfaitement pointer vers une adresse privée. Voir
# `deploy/scripts/setup-lan-tls.sh`.
#
# ─── CE FICHIER NE REMPLACE PAS `jarvis-hud.conf` ─────────────────────────
#
# Les deux cohabitent volontairement. `jarvis-hud.conf` sert le HUD en clair
# sur 8080, et c'est ce que le tunnel inverse vers le VPS consomme. Tant que
# la bascule DNS n'est pas faite, l'accès public continue de fonctionner par
# là. On retire 8080 quand le VPS sort du chemin, pas avant.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen [::]:80;
    server_name jarvis.global-it-ss.com;

    # ACME passe par le DNS, jamais par HTTP : il n'y a donc aucun
    # `/.well-known/acme-challenge` à laisser passer ici. Tout est redirigé.
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name jarvis.global-it-ss.com;

    ssl_certificate     /etc/letsencrypt/live/jarvis.global-it-ss.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.global-it-ss.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:JARVIS:10m;
    ssl_session_timeout 1d;

    # Pas de HSTS, et c'est délibéré. HSTS grave dans chaque navigateur du
    # foyer l'obligation d'utiliser HTTPS sur ce nom. Le jour où le certificat
    # expire sans qu'on l'ait vu — panne de renouvellement, jeton Cloudflare
    # révoqué — plus AUCUN appareil de la maison n'a de porte de secours, et
    # la tablette murale devient un presse-papier jusqu'à réparation. Sur une
    # machine domestique servie en LAN, le gain de HSTS est théorique et le
    # risque de blocage est réel.

    root  /opt/jarvis/hud/dist;
    index index.html;

    access_log /var/log/nginx/jarvis-lan.access.log;
    error_log  /var/log/nginx/jarvis-lan.error.log;

    # WebSocket du Core, servi sous la MÊME origine que le HUD.
    #
    # C'est ce qui permet à `hud/src/app/bridge/coreClient.ts` de dériver son
    # URL tout seul : page en `https:` → `wss://<host>/ws`. Aucune variable
    # d'environnement à poser, aucun build spécifique au lieu depuis lequel on
    # se connecte. Le Core, lui, reste en loopback et n'est jamais joignable
    # directement.
    location /ws {
        proxy_pass         http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Une session HUD dure des heures sans forcément rien émettre : la
        # checklist de boot passe, l'écran de verrouillage attend. Un timeout
        # court couperait la socket en silence et le HUD repartirait dans son
        # cycle de reconnexion sans que personne comprenne pourquoi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # La latence est le sujet de cette bascule : on ne tamponne rien.
        # Une trame WebSocket retenue le temps de remplir un tampon, c'est un
        # orbe qui pulse en retard sur la voix.
        proxy_buffering off;
        tcp_nodelay      on;
    }

    # Satellite salon (Pi) — utterances micro → Core HTTP loopback :8766
    location /v1/salon/ {
        proxy_pass         http://127.0.0.1:8766/v1/salon/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 8m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Device Capability Discovery (Phase 0) — même serveur ingest :8766
    location /v1/devices/ {
        proxy_pass         http://127.0.0.1:8766/v1/devices/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /v1/devices {
        proxy_pass         http://127.0.0.1:8766/v1/devices;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Agent Windows — bootstrap + fichiers install
    location /v1/agent/ {
        alias /opt/jarvis/share/windows-agent/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }

    # Dashboard admin (dashboard/dist → /opt/jarvis/dashboard/dist)
    location /dashboard/ {
        alias /opt/jarvis/dashboard/dist/;
        index index.html;
    }

    location /dashboard/assets/ {
        alias /opt/jarvis/dashboard/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /dashboard/index.html {
        alias /opt/jarvis/dashboard/dist/index.html;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le HTML porte le nom des bundles ; le mettre en cache ferait servir un
    # index qui référence des assets disparus après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

# HUD JARVIS — service des fichiers statiques du build React.
#
# ─── POURQUOI UN SERVEUR, ET PAS `file://` ────────────────────────────────
#
# Le premier réflexe est de faire pointer Chromium sur
# `/opt/jarvis/hud/dist/index.html` et de se passer de serveur. Ça ne marche
# pas : Vite produit `<script type="module">`, et Chromium refuse les modules
# ES chargés depuis `file://`. Le contournement serait
# `--allow-file-access-from-files`, c'est-à-dire désactiver une protection du
# navigateur sur le kiosque de la maison. Hors de question.
#
# ─── POURQUOI PAS LE CORE ─────────────────────────────────────────────────
#
# « Un service systemd par fonction, jamais un monolithe » (CLAUDE.md).
# Servir des fichiers n'est pas le travail de l'orchestrateur, et un Core qui
# redémarre ne doit pas emporter l'affichage avec lui.
#
# ─── ÉCOUTE LOCALE UNIQUEMENT ─────────────────────────────────────────────
#
# `127.0.0.1` et non `0.0.0.0` : le kiosque tourne sur CETTE machine. L'accès
# depuis l'extérieur passe par le tunnel sortant vers le VPS, jamais par une
# exposition sur le réseau local. `INSTALLATION_DEPLOIEMENT.md` pose déjà
# « aucun port ouvert sur la box » — autant ne pas en ouvrir sur le LAN.
#
# Installation : /etc/nginx/conf.d/jarvis-hud.conf

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /opt/jarvis/hud/dist;
    index index.html;

    access_log /var/log/nginx/jarvis-hud.access.log;
    error_log  /var/log/nginx/jarvis-hud.error.log;

    # Repli SPA. Le HUD utilise react-router : les routes n'existent que côté
    # client. Sans ce `try_files`, un rafraîchissement sur une sous-route
    # renvoie un 404 — et sur un kiosque sans clavier, on ne s'en sort plus.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les noms d'assets portent un hash de contenu : ils sont immuables par
    # construction, donc cachables indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, JAMAIS. C'est lui qui référence les assets hashés : mis en
    # cache, un déploiement resterait invisible jusqu'à ce que quelqu'un vide
    # le cache du kiosque à la main.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ─── À VENIR ──────────────────────────────────────────────────────────
    # Dashboard et Setup Center ne sont pas finalisés : pas de bloc pour eux
    # tant qu'il n'y a rien à servir. Quand ce sera le cas, un `server` par
    # front, sur 8081 et 8082, même écoute locale. Ne PAS les servir en
    # sous-chemins de celui-ci : il faudrait alors régler `base` dans leurs
    # configs Vite, et le HUD est une racine de kiosque.
}

# HUD JARVIS — fichiers statiques React + proxy WebSocket vers le Core.
#
# Écoute : toutes les interfaces (`8080`), pas seulement 127.0.0.1.
# Pourquoi : le Client Twingate (PC / téléphone hors maison) atteint le NUC
# via le Connector en LAN (`192.168.1.37:8080`). La Freebox n'ouvre PAS 8080
# sur Internet — seul Twingate y entre.
#
# Le Core reste en loopback (`127.0.0.1:8765`). nginx proxifie `/ws`.
#
# Installation : /etc/nginx/conf.d/jarvis-hud.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/jarvis/hud/dist;
    index index.html;

    access_log /var/log/nginx/jarvis-hud.access.log;
    error_log  /var/log/nginx/jarvis-hud.error.log;

    # WebSocket Core — même origine que le HUD (évite ws://127.0.0.1 côté remote)
    location /ws {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Satellite salon (Pi) — utterances micro → Core HTTP loopback :8766
    location /v1/salon/ {
        proxy_pass http://127.0.0.1:8766/v1/salon/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Device Capability Discovery (Phase 0) — même serveur ingest :8766
    location /v1/devices/ {
        proxy_pass http://127.0.0.1:8766/v1/devices/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # GET /v1/devices (sans slash) — list
    location = /v1/devices {
        proxy_pass http://127.0.0.1:8766/v1/devices;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Agent Windows — bootstrap + fichiers install (sync deploy/windows-agent)
    location /v1/agent/ {
        alias /opt/jarvis/share/windows-agent/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

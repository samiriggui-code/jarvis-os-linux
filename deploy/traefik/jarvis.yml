# Traefik dynamic — HUD JARVIS (HTTPS Let's Encrypt)
# VPS : /opt/traefik/dynamic/jarvis.yml
# Backend = reverse tunnel depuis le NUC (127.0.0.1:18080 → nginx HUD :8080)
http:
  routers:
    jarvis:
      rule: "Host(`jarvis.global-it-ss.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: jarvis
      priority: 100
  services:
    jarvis:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:18080"
